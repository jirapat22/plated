<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Plated" />
  <meta name="theme-color" content="#0d0d0f" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/icon-192.svg" />
  <link rel="stylesheet" href="/css/style.css" />
  <title>Plated</title>
</head>
<body>

<!-- ─── Lock / Setup Screen ──────────────────────────────── -->
<div id="lock-screen" class="lock-screen">
  <div class="lock-brand">
    <div class="lock-logo">
      <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
        <circle cx="24" cy="24" r="20" stroke="#c8b8ff" stroke-width="2.5"/>
        <circle cx="24" cy="24" r="13" stroke="#c8b8ff" stroke-width="1.5" stroke-dasharray="4 3"/>
        <circle cx="24" cy="24" r="4" fill="#c8b8ff"/>
      </svg>
    </div>
    <h1 class="lock-title">Plated</h1>
    <p class="lock-subtitle" id="lock-subtitle">Enter passcode</p>
  </div>

  <div class="lock-dots" id="lock-dots">
    <span class="dot"></span><span class="dot"></span>
    <span class="dot"></span><span class="dot"></span>
  </div>

  <div class="numpad" id="numpad">
    <button class="numpad-key" data-digit="1">1</button>
    <button class="numpad-key" data-digit="2">2<span>ABC</span></button>
    <button class="numpad-key" data-digit="3">3<span>DEF</span></button>
    <button class="numpad-key" data-digit="4">4<span>GHI</span></button>
    <button class="numpad-key" data-digit="5">5<span>JKL</span></button>
    <button class="numpad-key" data-digit="6">6<span>MNO</span></button>
    <button class="numpad-key" data-digit="7">7<span>PQRS</span></button>
    <button class="numpad-key" data-digit="8">8<span>TUV</span></button>
    <button class="numpad-key" data-digit="9">9<span>WXYZ</span></button>
    <button class="numpad-key numpad-empty"></button>
    <button class="numpad-key" data-digit="0">0</button>
    <button class="numpad-key numpad-back" id="numpad-back">
      <svg width="22" height="16" viewBox="0 0 22 16" fill="none">
        <path d="M8 1L1 8L8 15M1 8H21" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>

  <button class="lock-action hidden" id="lock-action">Unlock</button>
</div>

<!-- ─── Main App ──────────────────────────────────────────── -->
<div id="app" class="app hidden">
  <main id="view-container" class="view-container"></main>

  <nav class="bottom-nav" id="bottom-nav">
    <button class="nav-item active" data-view="today">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none">
        <rect x="3" y="6" width="18" height="15" rx="2" stroke="currentColor" stroke-width="1.7"/>
        <path d="M3 10h18" stroke="currentColor" stroke-width="1.7"/>
        <path d="M8 3v3M16 3v3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        <circle cx="8" cy="15" r="1.2" fill="currentColor"/>
        <circle cx="12" cy="15" r="1.2" fill="currentColor"/>
      </svg>
      <span>Today</span>
    </button>
    <button class="nav-item" data-view="history">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none">
        <path d="M12 8v4l3 3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        <path d="M3.05 11a9 9 0 1 0 .5-3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        <path d="M3 5v3h3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>History</span>
    </button>
    <button class="nav-item" data-view="trends">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none">
        <path d="M3 17l5-5 4 4 5-6 4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>Trends</span>
    </button>
    <button class="nav-item" data-view="foods">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none">
        <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.7"/>
        <path d="M17 17l3.5 3.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
      </svg>
      <span>Foods</span>
    </button>
    <button class="nav-item" data-view="settings">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.7"/>
        <path d="M12 2v2M12 20v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M2 12h2M20 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
      </svg>
      <span>Settings</span>
    </button>
  </nav>
</div>

<!-- ─── Bottom Sheet ───────────────────────────────────────── -->
<div id="sheet-overlay" class="sheet-overlay hidden"></div>
<div id="sheet" class="sheet hidden">
  <div class="sheet-handle-bar">
    <div class="sheet-handle"></div>
  </div>
  <div id="sheet-content" class="sheet-content"></div>
</div>

<!-- ─── Toast Container ───────────────────────────────────── -->
<div id="toast-container" class="toast-container" aria-live="polite"></div>

<!-- CDN: html5-qrcode for barcode scanning -->
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<!-- CDN: Chart.js for trends -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

<script type="module" src="/js/app.js"></script>
</body>
</html>
